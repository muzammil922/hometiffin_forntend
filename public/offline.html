<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Home Tiffin</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #FFF8E7; /* Warm cream background */
      color: #065F46; /* Dark green text */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 480px;
      padding: 40px;
      background: #FFFFFF;
      border-radius: 24px; /* rounded-3xl */
      box-shadow: 0 4px 20px rgba(6, 95, 70, 0.08);
      margin: 20px;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      margin: 0 0 10px 0;
      font-weight: 600;
    }
    p {
      font-size: 16px;
      color: #4B5563; /* Slate-600 */
      margin: 0 0 30px 0;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background-color: #065F46;
      color: #FFFFFF;
      text-decoration: none;
      padding: 12px 32px;
      font-weight: 500;
      border-radius: 16px; /* rounded-2xl */
      transition: background-color 0.2s;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }
    .btn:hover {
      background-color: #044e39;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🍱</div>
    <h1>You are offline</h1>
    <p>Ghar ka khana, aapke darwaze tak requires an internet connection. Please check your network connection and try again.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
