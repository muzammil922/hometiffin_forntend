<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #065F46;
      width: 512px;
      height: 512px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .logo-container {
      position: relative;
      width: 320px;
      height: 388px;
    }
    .logo-outline, .logo-filled {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="logo.svg" class="logo-outline" />
    <img src="logo animation.svg" class="logo-filled" />
  </div>
</body>
</html>
